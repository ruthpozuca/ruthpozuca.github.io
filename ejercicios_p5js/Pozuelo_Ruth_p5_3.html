<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 3 - Figuras y rellenos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(400, 400);
  background(100);  // Fondo blanco


  // 1. Rectángulo con relleno: color rosa claro
  fill(252, 221, 205);
  rect(60, 200, 280, 180);

  // 5. Triángulo rojo;
  fill(255, 0, 0);
  triangle(200, 60, 40, 200, 360, 200);

 // 2. Rectángulo azul opaco
  fill(0, 0, 253);
  rect(85, 220, 60, 75);


  // 4. Rectángulo verde
  fill(0, 0, 253);
  rect(250, 220, 60, 75);

  // 2. Rectángulo azul opaco
  fill(128, 64, 0);
  rect(165, 280, 65, 100);



}
</script>
</body>
</html>
