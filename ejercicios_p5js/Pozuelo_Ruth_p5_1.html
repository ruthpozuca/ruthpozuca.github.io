<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 1 - Líneas y colores</title>
  <!-- Cargamos la biblioteca p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <!-- A partir de aquí escribimos nuestro programa -->
  <script>
    function setup() {
      createCanvas(400, 400);
      background(255);

      // Lado superior: rojo opaco, grosor 4.
      stroke(200, 60, 0);
      strokeWeight(4);
      line(200, 200, 350, 200);

      // Lado derecho: azul verdoso casi totalmente transparente, grosor 7.
      stroke(0, 155, 100, 200);
      strokeWeight(7);
      line(350, 200, 350, 350);

      // Lado inferior: verde opaco, grosor 5.
      stroke(150, 255, 0);
      strokeWeight(5);
      line(350, 350, 200, 350);

      // Lado izquierdo: rosa pálido semitransparente, grosor 1.
      stroke(120, 0, 0, 150);
      strokeWeight(1);
      line(200, 350, 200, 200);
    }
  </script>
</body>
</html>
