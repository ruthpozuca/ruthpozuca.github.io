<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 2 - Colores aleatorios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(800, 800);
      background(144, 238, 144);
      strokeWeight(4);


      // Cada lado recibe un color aleatorio.
         stroke(random(255), random(255), random(255));
         line (100, 600, 100, 100);
         line (100, 100, 300, 100);
         line (300, 100, 100, 350);
         line (100, 350, 300, 600);

         stroke(random(255), random(255), random(255));
         line (350, 600, 350, 100);
         line (350, 100, 550, 100);
         line (550, 100, 550, 350);
         line (550, 350, 350, 350);

         stroke(random(255), random(255), random(255));
         line (600, 100, 600, 600);
         line (600, 100, 750, 100);
         line (600, 600, 750, 600);
     
    }
  </script>
</body>
</html>
