
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 5 - Mi creación estática</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
 
function setup() {
  createCanvas(600, 400);
  background(255);

  // Variables derivadas del tamaño del lienzo.
  let centroX = width / 2;
  let centroY = height / 2;
  let diametro = height * 0.55;
  let separacion = diametro * 0.20;
  let diametroOjo = diametro * 0.085;

  // Solo dibujamos los contornos.
  noFill();
  stroke(0);
  strokeWeight(2);


  // Circunferencia central.
  fill(255, 245, 190);
  stroke(0);
  strokeWeight(diametro * 0.015);
  circle(centroX, centroY, diametro);



  //Ojo izquierdo;
  fill(0);
  noStroke();
  circle(centroX - separacion, centroY - diametro * 0.125, diametroOjo);

  //Ojo derecho;
  fill(0);
  noStroke();
  circle(centroX + separacion, centroY - diametro * 0.125, diametroOjo);
 
  //Sonrisa;
  noFill();
  stroke(0);
  strokeWeight(4);
  arc(centroX, centroY + diametro * 0.09,
      diametro * 0.54, diametro * 0.36, 0, PI);
  
  //Cejas;
  noFill();
  stroke(0);
  strokeWeight(4);

  arc(centroX - separacion, centroY - diametro * 0.20,
      diametro * 0.25, diametro * 0.2, PI, 0);
  arc(centroX + separacion, centroY - diametro * 0.20,
      diametro * 0.25, diametro * 0.2, PI, 0);



}
</script>
</body>
</html>
